limit_req_zone $binary_remote_addr zone=sm_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name smsurvival.bmstu.ru;
    server_tokens off;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /var/log/nginx/sm-instruction.access.log;
    error_log /var/log/nginx/sm-instruction.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=sm_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/sm-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/sm-proxy.conf;
    }
}
